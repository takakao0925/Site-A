<svg width="459" height="115" viewBox="0 0 459 115" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* ---- knobs ---- */
    .numbers-anim { --draw-duration: 1s; --pen: 34; }

    /* one continuous pen stroke, revealed from the N end to the s end,
       clipped to the Mr Dafoe letterforms so the weight is preserved */
    .numbers-anim .cl {
      fill: none;
      stroke: #218EF8;
      stroke-width: var(--pen);
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1 1;            /* pathLength = 1 */
      stroke-dashoffset: -1;            /* start: nothing drawn (path runs s -> N) */
      animation: nd var(--draw-duration) linear forwards;
    }
    @keyframes nd { to { stroke-dashoffset: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .numbers-anim .cl { animation: none; stroke-dashoffset: 0; }
    }
  </style>

